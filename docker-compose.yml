services:
  app:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - vendor_data:/var/www/vendor
      - ./Backend/.env:/var/www/.env
      - ./Backend/docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - laravel_network
    depends_on:
      - mysql_db

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    stdin_open: true
    tty: true
    container_name: point_sale_frontend
    ports:
      - "8080:8080"

  nginx:
    image: nginx:alpine
    container_name: laravel_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    env_file:
    - ./Backend/.env
    volumes:
      - ./Backend:/var/www
      - ./Backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel_network
    depends_on:
      - app

  mysql_db:
    image: mysql:8.0
    container_name: point_sale_mysql
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - laravel_network

networks:
  laravel_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local

  vendor_data:
    driver: local
